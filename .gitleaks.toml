title = "phicc discord bridge"

[extend]
useDefault = true

[[rules]]
id = "discord-bot-token"
description = "Discord bot token"
regex = '''(?i)\b[a-z0-9_-]{24,}\.[a-z0-9_-]{6}\.[a-z0-9_-]{27,}'''

[allowlist]
description = "placeholders and docs that name env vars without values"
paths = ['''config\.example\.json''', '''tests/''']
