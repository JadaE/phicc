title = "phicc discord bridge"

[extend]
useDefault = true

[[rules]]
id = "discord-bot-token"
description = "Discord bot token"
regex = '''(?i)\b[a-z0-9_-]{24,}\.[a-z0-9_-]{6}\.[a-z0-9_-]{27,}'''

[allowlist]
description = "placeholder config only; tests stay scanned"
paths = ['''(^|/)config\.example\.json$''']
